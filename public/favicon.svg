<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Charcoal Rounded Base -->
  <rect width="64" height="64" rx="14" fill="url(#darkBg)" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Rotated Gold Diamond Accent -->
  <rect x="23" y="9" width="18" height="18" rx="3" transform="rotate(45 32 18)" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Monogram L in Premium Gold -->
  <path d="M22 17 V45 H42" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)" />

  <!-- Sparkle Accent -->
  <circle cx="43" cy="19" r="2.2" fill="#FEF3C7" />
</svg>
